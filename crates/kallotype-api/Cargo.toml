[package]
name = "kallotype-api"
description = "The use-case layer: load a photograph, develop it, print it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[features]
default = ["gpu", "raw"]
# Render on the device when there is one. The CLI's report names the backend.
gpu = ["dep:kallotype-gpu"]
# Read camera raws. The decoder is MIT/Apache-2.0, so this is a default.
raw = ["dep:kallotype-raw"]

[dependencies]
kallotype-core = { path = "../kallotype-core", version = "0.1.0" }
kallotype-gpu = { path = "../kallotype-gpu", version = "0.1.0", optional = true }
kallotype-io = { path = "../kallotype-io", version = "0.1.0" }
kallotype-raw = { path = "../kallotype-raw", version = "0.1.0", optional = true }
kallotype-spectral = { path = "../kallotype-spectral", version = "0.1.0" }
serde_json.workspace = true

[lints]
workspace = true
