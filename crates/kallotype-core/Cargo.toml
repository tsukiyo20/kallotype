[package]
name = "kallotype-core"
description = "Reference film model: characteristic curves and development kinetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["film", "simulation", "photography", "colour", "development"]
categories = ["graphics", "simulation"]

[features]
default = ["parallel"]
# Render the pixels on every core. On by default because the render is
# embarrassingly parallel; turn it off for a target without threads.
parallel = ["dep:rayon"]

[dependencies]
kallotype-spectral = { path = "../kallotype-spectral", version = "0.1.0" }
rayon = { version = "1", optional = true }

[lints]
workspace = true
