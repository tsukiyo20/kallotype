[package]
name = "kallotype-cli"
description = "The `kalo` command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["cli", "film", "photography", "command-line", "render"]
categories = ["command-line-interface", "multimedia::images"]

[lib]
name = "kallotype_cli"
path = "src/lib.rs"

[[bin]]
name = "kalo"
path = "src/main.rs"

[features]
# Opt-in: enabling it drags wgpu and about two hundred crates into the build of
# a command line tool that does not need a GPU to be useful.
gpu = ["dep:kallotype-gpu"]

[dependencies]
kallotype-core = { path = "../kallotype-core", version = "0.1.0" }
kallotype-gpu = { path = "../kallotype-gpu", version = "0.1.0", optional = true }
kallotype-io = { path = "../kallotype-io", version = "0.1.0" }
kallotype-spectral = { path = "../kallotype-spectral", version = "0.1.0" }
clap.workspace = true

[lints]
workspace = true
