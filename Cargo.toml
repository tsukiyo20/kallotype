[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kallotype/kallotype"
authors = ["Kallotype contributors"]

[workspace.dependencies]
kallotype-core = { path = "crates/kallotype-core" }
kallotype-io = { path = "crates/kallotype-io" }

image = { version = "0.25", default-features = false, features = [
    "png",
    "tiff",
    "jpeg",
] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
