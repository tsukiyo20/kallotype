[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Kallotype contributors"]
repository = "https://github.com/tsukiyo20/kallotype"
homepage = "https://github.com/tsukiyo20/kallotype"
readme = "README.md"
keywords = ["photography", "film", "rendering", "colour", "simulation"]
categories = ["graphics", "multimedia::images"]
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "tiff",
    "jpeg",
] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
