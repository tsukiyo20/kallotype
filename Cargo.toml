[workspace]
resolver = "3"
members = ["crates/*"]
# `kallotype-raw` decodes camera raw files and links `rawler`, which is
# LGPL-2.1. It is deliberately outside the workspace so that a default build,
# `cargo test --workspace` and `cargo deny` are MIT/Apache-2.0 all the way down.
# The CLI reaches it through an optional path dependency behind `--features
# kallotype-cli/raw`; see the crate's own doc comment.
exclude = ["crates/kallotype-raw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Kallotype contributors"]
repository = "https://github.com/tsukiyo20/kallotype"
homepage = "https://github.com/tsukiyo20/kallotype"
readme = "README.md"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "tiff",
    "jpeg",
] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
