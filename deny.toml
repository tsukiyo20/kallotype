# cargo-deny policy.
#
# The project ships binaries, so the licence policy is stricter than a library's:
# no copyleft in the dependency graph, no unknown registries, no git sources.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is reached only through wgpu's type machinery, and it is a
    # proc-macro that expands at compile time: there is no runtime code to be
    # vulnerable, and no maintained alternative that wgpu 26 accepts. It is
    # unmaintained, not broken. Dropping it means raising the workspace MSRV to
    # 1.87 for wgpu 30, which is a decision with its own cost and is not worth
    # taking for a macro.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro in wgpu 26; no runtime code" },
]

[licenses]
# Permissive only. If a dependency needs an addition, add it here with a
# comment explaining why, in the same commit that adds the dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Allowed-but-unused licences are fine: the list is a policy for future
# dependencies, not an inventory of today's.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Not used today. Listed so that a future dependency cannot quietly pull
    # OpenSSL in next to the system TLS stack.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
