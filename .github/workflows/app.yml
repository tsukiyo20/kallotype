name: app

# No path filters, on purpose: see the note in `ci.yml`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The golden tests are skipped off Windows: they are a local instrument,
      # drawn with the machine's own faces, and there is no baseline elsewhere
      # until the app pins a face of its own.
      - run: flutter test
