name: app

# No path filters, on purpose: see the note in `ci.yml`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `channel: stable`. A channel moves the renderer under the
      # app: 3.47 swapped the desktop renderer to Impeller and turned on wide
      # gamut on the Mac, which changed how every colour in this app is drawn.
      # An unpinned channel means a build can change what the product looks
      # like without a commit. The version here is the one in `app/.fvmrc`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The golden tests are skipped off Windows: they are a local instrument,
      # drawn with the machine's own faces, and there is no baseline elsewhere
      # until the app pins a face of its own.
      - run: flutter test
